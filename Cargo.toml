[package]
name = "dashe"
version = "0.1.0"
edition = "2021"
authors = ["Dashe Contributors"]
description = "A modern, blazing-fast terminal customizer for Linux/Bash"
license = "MIT"
readme = "README.md"
repository = "https://github.com/gabriel3atista/dashe"
keywords = ["terminal", "prompt", "shell", "customization", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "dashe"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "color", "suggestions"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

# Terminal rendering
crossterm = "0.27"
ratatui = "0.26"
colored = "2"
indicatif = { version = "0.17", features = ["tokio"] }

# Git integration
git2 = { version = "0.18", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (sync cloud)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# File system / paths
dirs = "5"
notify = "6"

# Secure credential storage
keyring = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
glob = "0.3"
once_cell = "1"
dialoguer = "0.11"
console = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
